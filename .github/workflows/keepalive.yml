name: Keep-Alive Ping

on:
  schedule:
    # Ping every 10 minutes to prevent Render free-tier spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          RENDER_BACKEND_URL="${{ secrets.RENDER_URL || 'https://rakshak-ai-3ckj.onrender.com' }}"
          echo "Pinging ${RENDER_BACKEND_URL}/health..."
          curl -f -s -m 30 "${RENDER_BACKEND_URL}/health" || echo "Warning: Health check failed or timed out"
