name: GuardianLine CI

on:
  push:
    branches: [ main, voice, lane-d, lane-c ]
  pull_request:
    branches: [ main, voice, lane-d, lane-c ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Test Suite (Unit, Integration, Contract, Schema)
        run: |
          python -m pytest tests -v

      - name: Run Text-Mode Conversation Simulator (T-HARN)
        run: |
          python scripts/text_harness.py

      - name: Run Real-Time Scam Classifier Benchmark (T-CLS)
        run: |
          python scripts/generate_classifier_benchmark.py

      - name: Validate Ground Truth Registry Export
        run: |
          python scripts/export_ground_truth.py

      - name: Compute Official Performance Scorecard (T-MET - Synthetic Dev Set)
        run: |
          python scripts/compute_metrics.py

      - name: Run Telephony STT Noise Robustness Benchmark
        run: |
          python scripts/test_noisy_stt.py

      - name: Run Telephony Audio Format & Codec Verification (8kHz PCM Check)
        run: |
          python scripts/run_audio_format_check.py
