name: GuardianLine CI

on:
  push:
    branches: [ main, voice, lane-d, lane-c, lane-b ]
  pull_request:
    branches: [ main, voice, lane-d, lane-c, lane-b ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Test Suite (Unit, Integration, Contract, Schema)
        run: |
          python -m pytest tests -v

      - name: Run Text-Mode Conversation Simulator (T-HARN)
        run: |
          python scripts/text_harness.py

      - name: Run Real-Time Scam Classifier Benchmark (T-CLS)
        run: |
          python scripts/generate_classifier_benchmark.py

      - name: Validate Ground Truth Registry Export
        run: |
          python scripts/export_ground_truth.py

      - name: Compute Official Performance Scorecard (T-MET - Synthetic Dev Set)
        run: |
          python scripts/compute_metrics.py

      - name: Run Telephony STT Noise Robustness Benchmark
        run: |
          python scripts/test_noisy_stt.py

      - name: Run Telephony Audio Format & Codec Verification (8kHz PCM Check)
        run: |
          python scripts/run_audio_format_check.py

  android-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper jar
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Run Android unit tests and build debug APK (T-AND)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Fail if no Android unit tests ran
        working-directory: android/app/build/test-results/testDebugUnitTest
        run: |
          count=$(grep -ho '<testcase ' *.xml | wc -l)
          echo "Android unit tests executed: $count"
          test "$count" -gt 0
