name: GuardianLine CI

on:
  push:
    branches: [ main, voice, lane-d ]
  pull_request:
    branches: [ main, voice, lane-d ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema requests httpx pydantic fastapi

      - name: Run Unit & Contract Tests (T-CONTRACT, T-PRIV, T-SCN)
        run: |
          python -m pytest tests/unit -v

      - name: Run Text-Mode Conversation Simulator (T-HARN)
        run: |
          python scripts/text_harness.py

      - name: Run Real-Time Scam Classifier Benchmark (T-CLS)
        run: |
          python scripts/generate_classifier_benchmark.py

      - name: Validate Ground Truth Registry Export
        run: |
          python scripts/export_ground_truth.py

      - name: Compute Official Performance Scorecard (T-MET)
        run: |
          python scripts/compute_metrics.py

      - name: Run Telephony STT Noise Robustness Benchmark
        run: |
          python scripts/test_noisy_stt.py

      - name: Run Telephony Audio Smoke Test Suite (T-VOICE)
        run: |
          python scripts/run_voice_smoke_test.py
